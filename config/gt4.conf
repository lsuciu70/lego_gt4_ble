# LWP3 GT4 SDK runtime configuration.
#
# Optional overrides for tuning knobs and the hub's MAC address. This file
# is NOT required to exist — a missing file, or a missing/malformed value
# for a given key, silently falls back to the compiled-in default for that
# field (see include/Lwp3Config.hpp). Protocol constants (BLE UUIDs, LWP3
# port IDs, message opcodes) are NOT here — those are hardware facts, not
# configuration, and stay in src/Lwp3Constants.hpp.
#
# Format: key=value, one per line. Lines starting with '#' are comments.
# Anything after a '#' on a value line is also treated as a comment.

# MAC address of the Move Hub, used by examples/tests that read this file.
mac_address=28:3C:90:9C:82:14

# Delta interval (raw units) for the opt-in IMU subscription (enableImu()).
# delta=1 confirmed safe on hardware when IMU is used WITHOUT drive
# encoders (enableDriveEncoders()) active at the same time — the two
# together reliably break the connection, confirmed reproducible; see
# README.md "IMU" section for the full finding.
imu_delta=1

# TX gating (txLoop()): a genuine change is sent immediately, bounded only
# by these floors; an unchanged value repeats at most once per
# keepalive_interval_ms. Steering and throttle are gated SEPARATELY —
# hardware sweep testing found a genuinely changing steer value safe up to
# at least 100Hz, while a genuinely changing throttle value broke the
# connection by 20Hz (virtual port) or 10Hz (direct writes). These
# defaults keep steering fast while keeping throttle safely below its
# lower, confirmed ceiling. See README.md "Drive Architecture" for the
# full characterization.
steer_rate_limit_ms=15
throttle_rate_limit_ms=200
keepalive_interval_ms=1000

# Epsilon-matching tolerance (raw position units) for latency stats —
# accounts for mechanical play/slop in the steering rack.
epsilon_deg=3.0

# Stall-detection thresholds used by autoCalibrate()'s sweep_to_limit().
stall_max_sweep_ms=1500
stall_poll_ms=50
stall_window_ms=200
stall_epsilon_raw=2
